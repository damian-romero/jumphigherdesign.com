{%- comment -%}
  Netlify Forms. Detected automatically on deploy (static HTML form).
  After first deploy: Netlify dashboard → Forms → add email notification to info@.
  Honeypot ("bot-field") + required privacy consent included.
{%- endcomment -%}
<form name="contacto" method="POST" action="{{ '/gracias/' | relative_url }}"
      data-netlify="true" netlify-honeypot="bot-field" class="contact-form">
  <input type="hidden" name="form-name" value="contacto">
  <p class="visually-hidden" aria-hidden="true">
    <label>No llenar si eres humano: <input name="bot-field" tabindex="-1" autocomplete="off"></label>
  </p>

  <div class="form-row">
    <div class="form-group">
      <label for="f-nombre">Nombre *</label>
      <input id="f-nombre" type="text" name="nombre" placeholder="Tu nombre completo" autocomplete="name" required>
    </div>
    <div class="form-group">
      <label for="f-empresa">Empresa</label>
      <input id="f-empresa" type="text" name="empresa" placeholder="Nombre de tu negocio" autocomplete="organization">
    </div>
  </div>

  <div class="form-group">
    <label for="f-email">Correo electrónico *</label>
    <input id="f-email" type="email" name="email" placeholder="correo@tunegocio.com" autocomplete="email" required>
  </div>

  <div class="form-group">
    <label for="f-tel">Teléfono / WhatsApp</label>
    <input id="f-tel" type="tel" name="telefono" placeholder="55 1234 5678" autocomplete="tel">
  </div>

  <div class="form-group">
    <label for="f-servicio">¿Qué servicio necesitas? *</label>
    <select id="f-servicio" name="servicio" required>
      <option value="">Selecciona una opción...</option>
      <option>Sitio web estático</option>
      <option>Sitio web con Odoo</option>
      <option>Identidad visual / logotipo</option>
      <option>Mantenimiento de sitio existente</option>
      <option>Todavía no estoy seguro</option>
    </select>
  </div>

  <div class="form-group">
    <label for="f-mensaje">Cuéntanos más *</label>
    <textarea id="f-mensaje" name="mensaje" required placeholder="Describe tu negocio y qué quieres lograr con tu sitio web. Mientras más detalle, mejor podemos orientarte desde el primer mensaje."></textarea>
  </div>

  <div class="form-group form-consent">
    <label><input type="checkbox" name="privacidad" required><span>Acepto el <a href="{{ '/aviso-de-privacidad/' | relative_url }}">aviso de privacidad</a> y el tratamiento de mis datos para responder a esta solicitud. *</span></label>
  </div>

  <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;padding:.85rem">Enviar mensaje →</button>
</form>
