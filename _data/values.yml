- title: Honestidad
  desc: "Decimos lo que funciona y lo que no. Sin promesas vacías ni alcances inflados para cerrar ventas."
- title: Claridad
  desc: "Explicamos todo en lenguaje que el cliente entiende. Nunca usamos tecnicismos como excusa para cobrar más."
- title: Precisión
  desc: "Entregamos lo acordado, en el tiempo acordado. Las propuestas son documentos vinculantes, no sugerencias."
- title: Autonomía del cliente
  desc: "El objetivo siempre es que puedas operar sin depender de nosotros para cada cambio pequeño."
- title: Accesibilidad
  desc: "Servicio de nivel profesional a precios justos para el mercado mexicano. Sin márgenes de agencia grande."
