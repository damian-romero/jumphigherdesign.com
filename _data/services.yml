static_pricing:
  - name: Básico
    badge: std
    price: "$5,500 MXN"
    note: "+ IVA · pago único"
    scope: "Hasta 3 páginas"
    features:
      - Diseño personalizado completo
      - 3 rondas de revisión
      - SEO básico incluido
      - Formulario de contacto
      - 15 días soporte post-entrega
  - name: Estándar
    badge: ft
    featured: true
    price: "$9,500 MXN"
    note: "+ IVA · pago único"
    scope: "Hasta 6 páginas"
    features:
      - Todo lo del básico
      - 5 rondas de revisión
      - Redacción de contenido básico
      - 1 integración externa incluida
      - 30 días soporte post-entrega
  - name: Páginas extra
    badge: cst
    price: "$800 MXN"
    note: "+ IVA · por página adicional"
    scope: "Más de 6 páginas"
    features:
      - Sin tier personalizado
      - Precio siempre predecible
      - Aprobación escrita previa

